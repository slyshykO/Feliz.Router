name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, format, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check F# formatting
        shell: bash
        run: |
          # Check tracked sources only; exclude generated Fable and build output.
          mapfile -d '' -t fsharp_files < <(git ls-files -z -- '*.fs' '*.fsi' '*.fsx')
          dotnet fantomas --check "${fsharp_files[@]}"

      - name: Restore Paket dependencies
        run: dotnet paket restore

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build solution
        run: dotnet build Feliz.Router.slnx --configuration Release

      - name: Build production demo
        run: npm run build:demo

      - name: Run console tests (Mocha and jsdom)
        run: npm test

      - name: Verify NuGet packaging
        run: dotnet pack src/Feliz.Router.fsproj --configuration Release --no-build
