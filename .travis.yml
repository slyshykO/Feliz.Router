language: csharp
mono: none
dotnet: 10.0.404
dist: noble

before_install:
  - nvm install 26
  - nvm use 26

install:
  - dotnet tool restore
  - dotnet paket restore
  - npm ci

script:
  - dotnet build Feliz.Router.sln --configuration Release
  - dotnet build build/Build.fsproj --configuration Release
  - npm run build:demo
  - npm test
  - dotnet pack src/Feliz.Router.fsproj --configuration Release --no-build
